<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Nossa Série</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: perfis → banner "série original" → fileiras horizontais de cartazes → modal de episódio */
:root{
  --bg:#0d0a0c; --surface:#1a1417; --surface-2:#251c20;
  --fg:#f4ecef; --muted:#a8979d; --accent:#e5486b; --gold:#f2c46d;
  --display:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.gutter{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}

/* ---------- tela de início: parede de fotos ---------- */
#start{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;isolation:isolate;text-align:center}
.wall{position:absolute;inset:-25% -15%;display:flex;gap:12px;transform:rotate(-8deg);z-index:-2;opacity:.6}
.wall .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;animation:wallUp 70s linear infinite}
.wall .col:nth-child(even){animation-name:wallDown;animation-duration:85s}
.wall img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 30%;border-radius:6px;display:block}
@keyframes wallUp{to{transform:translateY(-50%)}}
@keyframes wallDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
#start::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at center,rgba(13,10,12,.62),rgba(13,10,12,.86) 70%,var(--bg))}
.start-inner{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:64px}
.start-logo{position:absolute;top:max(20px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-size:clamp(30px,4vw,40px)}
@media(min-width:900px){.start-logo{left:48px}}
.who-title{font-weight:500;font-size:clamp(30px,5vw,52px);margin:0 0 18px;text-wrap:balance}
.profile{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);transition:color .2s}
.avatar{width:clamp(130px,20vw,190px);aspect-ratio:1;max-width:100%;border-radius:10px;border:3px solid transparent;background-size:cover;background-position:center 25%;transition:border-color .2s, transform .25s;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pname{font-size:clamp(17px,2vw,22px)}
.profile:hover,.profile:focus-visible{color:var(--fg)}
.profile:hover .avatar,.profile:focus-visible .avatar{border-color:var(--fg);transform:scale(1.06)}
.start-meta{margin:0 0 10px;color:var(--muted);font-size:15px}
.btn.big{font-size:18px;padding:14px 30px}

/* ---------- app ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;background:linear-gradient(var(--bg) 10%,transparent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--accent)}
.logo span{color:var(--gold)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{width:32px;height:32px;border-radius:5px;background-size:cover;background-position:center 25%}

.hero{position:relative;padding-block:clamp(120px,22vw,260px) clamp(40px,6vw,72px);overflow:hidden;isolation:isolate;margin-top:-64px}
.hero .bgimg{position:absolute;inset:0;z-index:-3;background:url(fotos/223a2931.jpg) center 35%/cover}
@media(min-width:800px){.hero .bgimg{left:30%}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:
   linear-gradient(0deg,var(--bg) 2%,transparent 45%),
   linear-gradient(90deg,var(--bg) 20%,rgba(13,10,12,.55) 55%,transparent 85%)}
@media(max-width:799px){.hero::before{background:linear-gradient(0deg,var(--bg) 25%,rgba(13,10,12,.55) 60%,rgba(13,10,12,.2))}}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:.6}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
.tag i{font-style:normal;color:var(--accent);font-family:var(--display);font-size:20px;letter-spacing:0}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(64px,13vw,150px);line-height:.88;margin:12px 0 16px;text-wrap:balance;max-width:10ch}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:16px}
.meta .match{color:#46d369;font-weight:800}
.meta .rating{border:1px solid var(--muted);padding:0 6px;font-size:12px}
.hero p{max-width:52ch;font-size:clamp(15px,1.6vw,18px);margin:0 0 24px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{border:0;border-radius:5px;padding:11px 24px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px}
.btn.play{background:var(--fg);color:var(--bg)}
.btn.info{background:rgba(160,150,155,.35);color:var(--fg)}
.btn:hover{filter:brightness(.88)}

.row{display:flex;flex-direction:column;gap:10px;margin-bottom:36px}
.row h3{font-size:clamp(17px,2vw,22px);margin:0;font-weight:800}
.row h3 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:8px 14px;scrollbar-width:thin;scrollbar-color:var(--surface-2) transparent}
.card{flex:0 0 auto;width:clamp(220px,24vw,300px);aspect-ratio:16/9;max-width:100%;border:0;border-radius:6px;position:relative;overflow:hidden;scroll-snap-align:start;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .25s;background:var(--surface)}
.card:hover,.card:focus-visible{transform:scale(1.05);z-index:2}
.card .art{position:absolute;inset:0;z-index:0}
.card .art video{width:100%;height:100%;object-fit:cover;display:block}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.85))}
.card .ep{position:relative;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card .t{position:relative;font-family:var(--display);font-size:clamp(24px,2.6vw,30px);line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.card .glyph{position:absolute;top:10px;right:12px;font-family:var(--display);font-size:52px;line-height:1;color:rgba(255,255,255,.35);z-index:1;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.card.new::before{content:"NOVO EPISÓDIO";position:absolute;top:0;left:0;z-index:2;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-bottom-right-radius:4px}
.card .playmark{position:absolute;top:10px;left:12px;z-index:2;font-size:11px;font-weight:800;letter-spacing:.1em;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:3px}

.card.poster2{width:clamp(140px,14vw,180px);aspect-ratio:2/3;padding:0}
.card.poster2 .art::after{background:none}

.top{width:clamp(180px,20vw,230px);aspect-ratio:auto;height:clamp(150px,16vw,190px);padding:0;background:none;display:flex;flex-direction:row;align-items:flex-end;justify-content:flex-start}
.top .num{font-family:var(--display);font-size:clamp(130px,15vw,180px);line-height:.78;color:var(--bg);-webkit-text-stroke:3px #6b5a60;flex:0 0 auto;margin-right:-22px;position:relative;z-index:1}
.top .poster{height:100%;flex:1;border-radius:5px;padding:10px 10px 10px 32px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;min-width:0}
.top .poster span{position:relative;font-family:var(--display);font-size:20px;line-height:1.02;color:#fff;text-wrap:balance}

.bar{position:relative;height:3px;background:rgba(255,255,255,.25);margin-top:8px;border-radius:2px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}

.s2{margin-block:24px 64px;border-radius:10px;background:var(--surface);padding:clamp(24px,4vw,48px);display:grid;gap:20px;grid-template-columns:1fr;align-items:center}
@media(min-width:800px){.s2{grid-template-columns:1.2fr 1fr}}
.s2 h3{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,72px);line-height:.9;margin:6px 0 10px}
.s2 p{margin:0;color:var(--muted);max-width:48ch}
.count{display:flex;gap:10px;flex-wrap:wrap}
.count div{background:var(--surface-2);border-radius:6px;padding:12px 14px;min-width:76px;text-align:center}
.count b{display:block;font-family:var(--display);font-size:40px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
footer{padding-block:24px 48px;color:var(--muted);font-size:13px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(720px,100%);background:var(--surface);border-radius:10px;overflow:hidden;animation:pop .28s ease-out;position:relative}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:.4}}
.sheet .cover{aspect-ratio:4/3;max-width:100%;position:relative;display:flex;align-items:flex-end;padding:20px 24px;background-color:var(--bg)}
@media(min-width:700px){.sheet .cover{aspect-ratio:16/10}}
.sheet .cover video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.sheet .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,var(--surface));pointer-events:none}
.sheet .cover.isvideo::after{display:none}
.sheet .cover h4{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:.9;margin:0;color:#fff;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sheet .cover.isvideo h4{display:none}
.sheet .close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:20px}
.sheet .body{padding:12px 24px 28px;display:flex;flex-direction:column;gap:12px}
.sheet .body p{margin:0;font-size:16px;max-width:60ch}
.sheet .body h5{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:4px}
.gal button{border:2px solid transparent;border-radius:5px;padding:0;aspect-ratio:3/4;max-width:100%;background-size:cover;background-position:center 30%}
.gal button[aria-pressed="true"]{border-color:var(--gold)}
.sheet .letter{font-family:var(--hand);font-size:clamp(24px,3.4vw,30px);line-height:1.25;color:var(--fg)}
.sheet .letter p{font-size:inherit}
.sign{color:var(--accent)}

/* ---------- abertura: montagem de fotos ---------- */
#intro{position:fixed;inset:0;z-index:60;background:#000;overflow:hidden}
#mBg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45)}
#mImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@media(max-width:700px){#mImg{object-fit:cover;object-position:center 30%}}
#mImg.go{animation:kb var(--d,300ms) linear forwards}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .22s ease-out}
@keyframes flash{from{opacity:.28}to{opacity:0}}
.myear{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(28px,env(safe-area-inset-bottom,0px));font-family:var(--display);font-size:clamp(72px,13vw,150px);line-height:1;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.ilogo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--display);font-size:clamp(64px,16vw,190px);letter-spacing:.04em;color:var(--accent);opacity:0;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.ilogo span{color:var(--gold)}
.ilogo.go{animation:tadum 2.2s ease-in forwards}
.skip{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:6px 14px;font-size:13px;font-weight:700;color:#fff}
@keyframes tadum{0%{transform:scale(.6);opacity:0;filter:blur(8px)}25%{transform:scale(1);opacity:1;filter:blur(0)}70%{transform:scale(1.08);opacity:1}100%{transform:scale(3.2);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#intro{display:none}}
</style>

<section id="start">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="logo start-logo" id="logoStart"></div>
  <div class="start-inner gutter">
    <h1 class="who-title">Quem está assistindo?</h1>
    <button class="profile" id="startBtn">
      <span class="avatar" id="startAv"></span>
      <span class="pname" id="startName"></span>
    </button>
    <p class="start-meta" id="startMeta"></p>
  </div>
</section>

<div id="intro" hidden>
  <div id="mBg"></div>
  <img id="mImg" alt="">
  <div class="flash" id="flash"></div>
  <span class="myear" id="mYear"></span>
  <div class="ilogo" id="introLogo"></div>
  <button class="skip" id="skip">Pular abertura ›</button>
</div>

<div id="app" hidden>
  <header class="gutter">
    <div class="logo" id="logo"></div>
    <div class="who"><span id="whoName"></span><b id="whoAv"></b></div>
  </header>

  <section class="hero gutter">
    <div class="bgimg" aria-hidden="true"></div>
    <canvas id="hearts" aria-hidden="true"></canvas>
    <div class="tag"><i>A&amp;G</i> Série original</div>
    <h2 id="heroTitle"></h2>
    <div class="meta">
      <span class="match">100% relevante</span>
      <span id="year"></span>
      <span class="rating">L</span>
      <span id="seasons"></span>
      <span>Romance · Comédia · Odontologia</span>
    </div>
    <p id="heroText"></p>
    <div class="ctas">
      <button class="btn play" id="playBtn">▶ Assistir</button>
      <button class="btn info" id="infoBtn">ⓘ Mais informações</button>
    </div>
  </section>

  <main class="gutter" id="rows"></main>

  <section class="gutter">
    <div class="s2">
      <div>
        <div class="tag"><i>●</i> Renovada</div>
        <h3 id="s2Title"></h3>
        <p id="s2Text"></p>
      </div>
      <div class="count" id="count"></div>
    </div>
  </section>
  <footer class="gutter" id="foot"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" aria-label="Fechar">✕</button>
    <div class="cover" id="mCover"><h4 id="mTitle"></h4></div>
    <div class="body" id="mBody"></div>
  </div>
</div>

// abertura
let introDone = false, introTimer = null;
function showApp(){
  if (introDone) return; introDone = true;
  clearTimeout(introTimer);
  $("#intro").hidden = true; $("#start").hidden = true; $("#app").hidden = false;
  startHearts(); scrollTo(0,0);
}
async function runIntro(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return showApp();
  $("#start").hidden = true; $("#intro").hidden = false;
  const list = DADOS.montagem;
  const imgs = list.map(([id]) => { const im = new Image(); im.src = src(id); return im; });
  await Promise.race([Promise.all(imgs.map(im => im.decode().catch(()=>{}))), new Promise(r => setTimeout(r, 2500))]);
  const img = $("#mImg"), bgEl = $("#mBg"), flash = $("#flash"), year = $("#mYear");
  const n = list.length;
  const restart = (el) => { el.classList.remove("go"); void el.offsetWidth; el.classList.add("go"); };
  let i = 0;
  const step = () => {
    if (introDone) return;
    if (i >= n) {           // final: segura a última foto e solta o logo
      year.textContent = "";
      img.style.setProperty("--d", "2400ms"); restart(img);
      restart($("#introLogo"));
      introTimer = setTimeout(showApp, 2300);
      return;
    }
    const [id, ano] = list[i];
    const d = Math.round(340 - 250 * Math.pow(i / (n - 1), 0.6));   // acelera: 340ms → 90ms
    img.src = src(id); bgEl.style.backgroundImage = `url(${src(id)})`;
    img.style.setProperty("--d", d + "ms"); restart(img);
    if (year.textContent !== String(ano)) { year.textContent = ano; restart(flash); }
    i++;
    introTimer = setTimeout(step, d);
  };
  step();
}

function card(e){
  const {t, d, cor, label, glyph, novo, p, foto, video} = e;

    ? `<div class="art"><video src="fotos/${video}.mp4" poster="fotos/${video}-poster.jpg" muted autoplay loop playsinline preload="metadata"></video></div><span class="playmark">▶ VÍDEO</span>`
    : `<div class="art" style="background:${bg(cor, foto)}"></div>`;
  b.innerHTML = `${art}${glyph ? `<span class="glyph">${esc(glyph)}</span>` : ""}
    ${label ? `<span class="ep">${esc(label)}</span>` : ""}<span class="t">${esc(t)}</span>
    ${p != null ? `<div class="bar"><i style="width:${p}%"></i></div>` : ""}`;

    html: `<p class="tag">${esc(label || "")}</p>${video ? `<h5>${esc(t)}</h5>` : ""}<p>${esc(d)}</p>` });
  return b;
}

function tick(){
  const alvo = new Date(DADOS.proximaData + "T00:00:00");
  const s = Math.max(0, Math.floor((alvo - Date.now())/1000));
  if (s === 0) {
    $("#s2Title").textContent = "Temporada 5 no ar";
    $("#s2Text").textContent = `Estreou em 22/10/2026. Quatro anos de ${DADOS.ela} e ${DADOS.ele}, e a melhor parte ainda nem foi ao ar.`;
  } else {

    $("#s2Text").textContent = `Mesmo elenco desde 2022. Mais viagens, mais risadas, ${DADOS.ela} cada vez mais perto de virar doutora. Estreia em 22 de outubro.`;
  }
  const parts = [[Math.floor(s/86400),"dias"],[Math.floor(s%86400/3600),"horas"],[Math.floor(s%3600/60),"min"],[s%60,"seg"]];
  $("#count").innerHTML = parts.map(([v,l]) => `<div><b>${String(v).padStart(2,"0")}</b><small>${l}</small></div>`).join("");
}

        t.onclick = () => { i = k; g.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed", j===k)); show(); };

      body.append(g);
    }
  } else if (galeria && galeria.length > 1) {
    const g = document.createElement("div"); g.className = "gal";

}

function startHearts(){
  const cv = $("#hearts"); if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches || cv.dataset.on) return;
  cv.dataset.on = 1;
  const ctx = cv.getContext("2d"); let W, H; const hs = [];
  const size = () => { W = cv.width = cv.offsetWidth * devicePixelRatio; H = cv.height = cv.offsetHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);
  for (let i = 0; i < 22; i++) hs.push({x:Math.random(), y:Math.random(), s:6+Math.random()*14, v:.0006+Math.random()*.0012, a:.15+Math.random()*.35});
  const heart = (x,y,s) => { ctx.beginPath(); ctx.moveTo(x, y+s*.3);
    ctx.bezierCurveTo(x, y, x-s*.5, y, x-s*.5, y+s*.3); ctx.bezierCurveTo(x-s*.5, y+s*.6, x, y+s*.8, x, y+s);
    ctx.bezierCurveTo(x, y+s*.8, x+s*.5, y+s*.6, x+s*.5, y+s*.3); ctx.bezierCurveTo(x+s*.5, y, x, y, x, y+s*.3); ctx.fill(); };
  (function loop(){
    ctx.clearRect(0,0,W,H);
    hs.forEach(h => { h.y -= h.v; if (h.y < -.1) { h.y = 1.1; h.x = Math.random(); }
      ctx.fillStyle = `rgba(229,72,107,${h.a})`; heart(h.x*W, h.y*H, h.s*devicePixelRatio); });
    requestAnimationFrame(loop);
  })();
}
